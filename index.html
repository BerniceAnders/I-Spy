<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="I Spy" />
  <title>I Spy Touch Game</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" aria-live="polite">
    <section id="startScreen" class="screen start-screen">
      <div class="start-card">
        <div class="start-stars" aria-hidden="true">★ ✦ ★</div>
        <h1>I SPY!</h1>
        <button id="playButton" class="play-button" type="button">PLAY</button>
      </div>
    </section>

    <section id="gameScreen" class="screen game-screen hidden" aria-label="I Spy game">
      <div id="sceneFrame" class="scene-frame">
        <img id="sceneImage" draggable="false" alt="I Spy hidden-object scene" />
        <div id="checkLayer" class="check-layer" aria-hidden="true"></div>
        <div id="feedbackLayer" class="feedback-layer" aria-hidden="true"></div>
        <div id="debugLayer" class="debug-layer" aria-hidden="true"></div>
      </div>
    </section>

    <section id="celebration" class="celebration hidden" aria-hidden="true">
      <div id="confetti" class="confetti" aria-hidden="true"></div>
      <div class="yay-card">
        <div class="yay-stars" aria-hidden="true">★ ✦ ★</div>
        <div class="yay-text">YAY!</div>
        <div class="yay-subtext">You found them all!</div>
      </div>
    </section>
  </main>

  <script src="scenes.js"></script>
  <script src="app.js"></script>
</body>
</html>
